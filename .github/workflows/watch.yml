name: Veille emploi Melbourne

on:
  schedule:
    - cron: "0 */6 * * *" # 4 fois par jour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      # Sans `ref`, checkout prend la branche par défaut du dépôt (main).
      # Ne jamais pointer une branche de travail ici : elle disparaît à la fusion.
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Récupérer l'état dans .watch-data
        uses: actions/checkout@v4
        with:
          ref: data
          path: .watch-data

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Passage de veille
        env:
          WATCH_STATE_DIR: .watch-data/data
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_TO_MATTHIEU: ${{ secrets.ALERT_EMAIL_TO_MATTHIEU }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: npm run watch

      - name: Commiter l'état mis à jour
        working-directory: .watch-data
        run: |
          git config user.name "job-hunter-agent"
          git config user.email "actions@github.com"
          # git diff ne voit que les fichiers suivis. Les états par profil
          # arrivent non suivis au premier passage : il faut donc les indexer
          # AVANT de tester s'il y a quelque chose à commiter, sinon la
          # condition sort et l'état n'est jamais sauvegardé.
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement d'état."
            exit 0
          fi
          git commit -m "chore(data): veille du $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin data
