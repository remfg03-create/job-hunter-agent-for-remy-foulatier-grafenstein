name: Job scan (4× daily)

# Runs every 6 hours = 4 times per day. Adjust the cron below to taste.
# Requires two repository secrets:
#   VERCEL_APP_URL  -> your deployed base URL, e.g. https://job-hunter-agent-for-remy.vercel.app
#   CRON_SECRET     -> the same value as the CRON_SECRET env var on Vercel
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # lets you trigger a scan manually from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a job scan
        run: |
          echo "Triggering scan on $VERCEL_APP_URL"
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$VERCEL_APP_URL/api/cron?secret=$CRON_SECRET")
          echo "HTTP $code"; cat /tmp/out.json || true
          test "$code" = "200"
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
